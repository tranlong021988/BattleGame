<!doctype html>
<html lang="en">

  <style>

    svg { display: block; min-width: 980px; width: 100%; height: 520px; }
    .grid { stroke: #33485c; stroke-width: 1; }
    .zero { stroke: #8ba0b2; stroke-width: 1.5; }
    .line { fill: none; stroke: #56d9a4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .point.main { fill: #64a8ff; } .point.side { fill: #f6b84b; }
    .point.loss { stroke: #ff6b6b; stroke-width: 3; }
    text { fill: #a9bac9; font-size: 12px; } .axis-title { fill: #dceafb; font-size: 13px; font-weight: 600; }
    .legend { display: flex; gap: 16px; color: #c7d7e5; margin: 14px 0 0; font-size: 13px; }
    .dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
