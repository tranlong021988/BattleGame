<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unit and card upgrade sale schedule, levels 1 to 60</title>
  <desc id="desc">A timeline showing unit unlocks and evenly distributed card cooldown, budget, and strength upgrade ranks. Level 1 is a tutorial with no offers. Grey bands mark boss levels.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="54" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033">Sale schedule: units and card upgrades — L1–60</text>
  <text x="54" y="76" font-family="Arial, sans-serif" font-size="15" fill="#475569">Each dot is one upgrade package becoming available. Card ranks are distributed between unit-unlock waves; later boss levels stay clear.</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">
    <circle cx="58" cy="108" r="6" fill="#2563eb"/><text x="72" y="113">Unit unlock</text>
    <circle cx="190" cy="108" r="6" fill="#9333ea"/><text x="204" y="113">Card unlock</text>
    <circle cx="320" cy="108" r="6" fill="#0891b2"/><text x="334" y="113">Cooldown rank</text>
    <circle cx="472" cy="108" r="6" fill="#d97706"/><text x="486" y="113">Budget rank</text>
    <circle cx="606" cy="108" r="6" fill="#16a34a"/><text x="620" y="113">Strength rank</text>
    <rect x="762" y="102" width="14" height="12" fill="#64748b" opacity=".18"/><text x="784" y="113">Boss</text>
  </g>

  <rect x="190" y="145" width="1110" height="355" fill="#ffffff" stroke="#cbd5e1"/>
  <g fill="#64748b" opacity=".14">
    <rect x="265" y="145" width="18" height="355"/><rect x="359" y="145" width="18" height="355"/>
    <rect x="453" y="145" width="18" height="355"/><rect x="547" y="145" width="18" height="355"/>
    <rect x="641" y="145" width="18" height="355"/><rect x="735" y="145" width="18" height="355"/>
    <rect x="829" y="145" width="18" height="355"/><rect x="923" y="145" width="18" height="355"/>
    <rect x="1017" y="145" width="18" height="355"/><rect x="1111" y="145" width="18" height="355"/>
    <rect x="1205" y="145" width="18" height="355"/><rect x="1290" y="145" width="10" height="355"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="190" y1="216" x2="1300" y2="216"/><line x1="190" y1="287" x2="1300" y2="287"/><line x1="190" y1="358" x2="1300" y2="358"/><line x1="190" y1="429" x2="1300" y2="429"/></g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="end"><text x="176" y="183">Unit</text><text x="176" y="254">Card</text><text x="176" y="325">Cooldown</text><text x="176" y="396">Budget</text><text x="176" y="467">Strength</text></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle"><text x="190" y="528">L1</text><text x="359" y="528">L10</text><text x="547" y="528">L20</text><text x="735" y="528">L30</text><text x="923" y="528">L40</text><text x="1111" y="528">L50</text><text x="1300" y="528">L60</text></g>

  <!-- Unit and card waves -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="600">
    <circle cx="359" cy="180" r="7" fill="#2563eb"/><text x="369" y="167" fill="#1d4ed8">Axeman</text><circle cx="359" cy="251" r="7" fill="#9333ea"/><text x="369" y="269" fill="#7e22ce">Axe Vanguard</text>
    <circle cx="641" cy="180" r="7" fill="#2563eb"/><text x="651" y="167" fill="#1d4ed8">Archer</text><circle cx="641" cy="251" r="7" fill="#9333ea"/><text x="651" y="269" fill="#7e22ce">Arrow + Precise</text>
    <circle cx="829" cy="180" r="7" fill="#2563eb"/><text x="839" y="167" fill="#1d4ed8">Cavalry</text>
    <circle cx="1017" cy="180" r="7" fill="#2563eb"/><text x="1027" y="167" fill="#1d4ed8">Monk</text><circle cx="1017" cy="251" r="7" fill="#9333ea"/><text x="1027" y="269" fill="#7e22ce">Wide Prayer + Counter</text>
  </g>

  <!-- Cooldown offers -->
  <g fill="#0891b2"><circle cx="359" cy="322" r="5"/><circle cx="397" cy="322" r="5"/><circle cx="472" cy="322" r="5"/><circle cx="566" cy="322" r="5"/><circle cx="641" cy="322" r="5"/><circle cx="660" cy="322" r="5"/><circle cx="679" cy="322" r="5"/><circle cx="716" cy="322" r="5"/><circle cx="773" cy="322" r="5"/><circle cx="829" cy="322" r="5"/><circle cx="867" cy="322" r="5"/><circle cx="942" cy="322" r="5"/><circle cx="1017" cy="322" r="5"/><circle cx="1054" cy="322" r="5"/><circle cx="1130" cy="322" r="5"/><circle cx="1168" cy="322" r="5"/><circle cx="1224" cy="322" r="5"/><circle cx="1262" cy="322" r="5"/></g>
  <!-- Budget offers -->
  <g fill="#d97706"><circle cx="378" cy="393" r="5"/><circle cx="416" cy="393" r="5"/><circle cx="491" cy="393" r="5"/><circle cx="585" cy="393" r="5"/><circle cx="641" cy="393" r="5"/><circle cx="679" cy="393" r="5"/><circle cx="698" cy="393" r="5"/><circle cx="716" cy="393" r="5"/><circle cx="792" cy="393" r="5"/><circle cx="848" cy="393" r="5"/><circle cx="886" cy="393" r="5"/><circle cx="961" cy="393" r="5"/><circle cx="1036" cy="393" r="5"/><circle cx="1073" cy="393" r="5"/><circle cx="1149" cy="393" r="5"/><circle cx="1187" cy="393" r="5"/><circle cx="1243" cy="393" r="5"/><circle cx="1281" cy="393" r="5"/></g>
  <!-- Strength offers: Spear/Sword R1, then R2 + Axe R1/R2 -->
  <g fill="#16a34a"><circle cx="510" cy="464" r="5"/><circle cx="604" cy="464" r="5"/><circle cx="716" cy="464" r="5"/><circle cx="773" cy="464" r="5"/><circle cx="811" cy="464" r="5"/><circle cx="867" cy="464" r="5"/><text x="368" y="486" font-family="Arial, sans-serif" font-size="11" fill="#15803d">R1 Spear/Sword</text><text x="650" y="486" font-family="Arial, sans-serif" font-size="11" fill="#15803d">R2 Spear/Sword + R1 Axe</text><text x="820" y="486" font-family="Arial, sans-serif" font-size="11" fill="#15803d">R2 Axe</text></g>

  <rect x="54" y="570" width="1492" height="108" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><text x="72" y="600" font-weight="700">How to read the schedule</text><text x="72" y="628">L10–24: wave-1 card ranks are spread across 13 non-boss offer slots. L25–34: 13 packages use 9 slots, so some levels intentionally have two packages.</text><text x="72" y="653">L51–59: the post-progression queue is shared and ordered: Wide Prayer/Counter R1 first, then R2. Enemy Strength rank uses this same ceiling.</text></g>
  <rect x="190" y="570" width="1110" height="154" fill="#ffffff" stroke="#cbd5e1"/>
  <g stroke="#cbd5e1" stroke-width="1"><line x1="190" y1="621" x2="1300" y2="621"/><line x1="190" y1="672" x2="1300" y2="672"/></g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="end"><text x="176" y="604">+1 unit</text><text x="176" y="655">Initial CP</text><text x="176" y="706">Max Alive</text></g>
  <g fill="#7c3aed"><circle cx="359" cy="601" r="5"/><circle cx="359" cy="593" r="5"/><circle cx="641" cy="601" r="5"/><circle cx="641" cy="593" r="5"/><circle cx="641" cy="585" r="5"/><circle cx="829" cy="601" r="5"/><circle cx="829" cy="593" r="5"/><circle cx="829" cy="585" r="5"/><circle cx="829" cy="577" r="5"/><circle cx="1017" cy="601" r="5"/><circle cx="1017" cy="593" r="5"/><circle cx="1017" cy="585" r="5"/><circle cx="1017" cy="577" r="5"/><circle cx="1017" cy="569" r="5"/><circle cx="1130" cy="601" r="5"/><circle cx="1149" cy="601" r="5"/><circle cx="1168" cy="601" r="5"/><circle cx="1187" cy="601" r="5"/><circle cx="1224" cy="601" r="5"/><circle cx="1243" cy="601" r="5"/><circle cx="1262" cy="601" r="5"/><circle cx="1281" cy="601" r="5"/></g>
  <g fill="#e11d48"><circle cx="209" cy="652" r="5"/><circle cx="228" cy="652" r="5"/><circle cx="284" cy="652" r="5"/><circle cx="322" cy="652" r="5"/><circle cx="378" cy="652" r="5"/><circle cx="416" cy="652" r="5"/><circle cx="472" cy="652" r="5"/><circle cx="510" cy="652" r="5"/><circle cx="566" cy="652" r="5"/><circle cx="604" cy="652" r="5"/><circle cx="660" cy="652" r="5"/><circle cx="698" cy="652" r="5"/><circle cx="754" cy="652" r="5"/><circle cx="792" cy="652" r="5"/><circle cx="848" cy="652" r="5"/><circle cx="886" cy="652" r="5"/><circle cx="942" cy="652" r="5"/><circle cx="980" cy="652" r="5"/><circle cx="1036" cy="652" r="5"/><circle cx="1073" cy="652" r="5"/></g>
  <g fill="#0f766e"><circle cx="209" cy="703" r="5"/><circle cx="228" cy="703" r="5"/><circle cx="284" cy="703" r="5"/><circle cx="378" cy="703" r="5"/><circle cx="472" cy="703" r="5"/><circle cx="566" cy="703" r="5"/></g>
  <rect x="54" y="762" width="1492" height="92" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><text x="72" y="792" font-weight="700">How to read the schedule</text><text x="72" y="820">Initial CP and Max Alive are distributed before each boss milestone. Max Alive stops once its configured cap is reached.</text><text x="72" y="842">+1 unit follows unit milestones, then uses the shared L51-59 tail queue. Enemy Strength uses the same rank ceiling as the player shop.</text></g>
</svg>
